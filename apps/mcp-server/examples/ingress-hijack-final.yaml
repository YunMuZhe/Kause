# ===========================
# 1. 模拟旧服务 (Old Service) - 保持不变
# ===========================
apiVersion: v1
kind: Service
metadata:
  name: old-service
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: old-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: old-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: old-app
  template:
    metadata:
      labels:
        app: old-app
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        command: 
        - "/bin/sh"
        - "-c"
        - |
          mkdir -p /usr/share/nginx/html/api
          echo 'I am the OLD LEGACY app (Hijacked!)' > /usr/share/nginx/html/api/payment
          nginx -g 'daemon off;'

---
# ===========================
# 2. 模拟新服务 (New Target) - 保持不变
# ===========================
apiVersion: v1
kind: Service
metadata:
  name: new-service
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: new-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: new-app
  template:
    metadata:
      labels:
        app: new-app
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        command: 
        - "/bin/sh"
        - "-c"
        - |
          mkdir -p /usr/share/nginx/html/api
          echo 'I am the NEW PAYMENT app' > /usr/share/nginx/html/api/payment
          nginx -g 'daemon off;'

---
# ===========================
# 3. Ingress 冲突现场
# ===========================

# 旧规则：正则匹配 /api/ 下的所有内容
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-legacy-wildcard
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: demo.local
    http:
      paths:
      - path: /api/.*
        pathType: ImplementationSpecific
        backend:
          service:
            name: old-service
            port:
              number: 80

---
# 新规则：【故障点在这里】
# 我们想匹配 /api/payment，但如果不小心写成了 /payments (多了一个s)
# 或者写成了 /payment (漏了 /api 前缀)
# 这里我们模拟：把路径错写成了 /api/payments (复数)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-new-payment
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: demo.local
    http:
      paths:
      # ！！！注意这里多了一个 's' ！！！
      - path: /api/payments
        pathType: Prefix
        backend:
          service:
            name: new-service
            port:
              number: 80