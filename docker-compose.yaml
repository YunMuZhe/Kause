version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kause_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: kause_secret
      MYSQL_DATABASE: kause
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

networks:
  default:
    name: kause_network
