apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-mysql-init
  namespace: kube-copilot-lab
data:
  01-order-lab.sql: |
    USE order_lab;

    DROP TABLE IF EXISTS order_items;
    DROP TABLE IF EXISTS orders;
    DROP TABLE IF EXISTS customers;

    CREATE TABLE customers (
      id BIGINT PRIMARY KEY,
      email VARCHAR(255) NOT NULL,
      full_name VARCHAR(255) NOT NULL,
      loyalty_tier VARCHAR(32) NOT NULL,
      created_at DATETIME NOT NULL,
      UNIQUE KEY idx_customers_email (email)
    );

    CREATE TABLE orders (
      id BIGINT PRIMARY KEY,
      customer_id BIGINT NOT NULL,
      status VARCHAR(32) NOT NULL,
      total_amount DECIMAL(10, 2) NOT NULL,
      created_at DATETIME NOT NULL,
      KEY idx_orders_customer_id (customer_id),
      KEY idx_orders_created_at (created_at)
    );

    CREATE TABLE order_items (
      id BIGINT PRIMARY KEY,
      order_id BIGINT NOT NULL,
      sku VARCHAR(64) NOT NULL,
      quantity INT NOT NULL,
      unit_price DECIMAL(10, 2) NOT NULL,
      KEY idx_order_items_order_id (order_id)
    );

    INSERT INTO customers (id, email, full_name, loyalty_tier, created_at)
    SELECT
      seq + 1,
      CONCAT('customer', LPAD(seq + 1, 5, '0'), '@lab.example.com'),
      CONCAT('Customer ', seq + 1),
      ELT((seq % 3) + 1, 'bronze', 'silver', 'gold'),
      TIMESTAMPADD(DAY, -1 * (seq % 365), NOW())
    FROM (
      SELECT ones.n + tens.n * 10 + hundreds.n * 100 + thousands.n * 1000 AS seq
      FROM
        (SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) ones
      CROSS JOIN
        (SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) tens
      CROSS JOIN
        (SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) hundreds
      CROSS JOIN
        (SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) thousands
    ) numbers
    WHERE seq < 5000;

    INSERT INTO orders (id, customer_id, status, total_amount, created_at)
    SELECT
      seq + 1,
      (seq % 5000) + 1,
      ELT((seq % 4) + 1, 'PAID', 'PENDING', 'SHIPPED', 'CLOSED'),
      ROUND(50 + (seq % 900) * 1.13, 2),
      TIMESTAMPADD(MINUTE, -1 * seq, NOW())
    FROM (
      SELECT ones.n + tens.n * 10 + hundreds.n * 100 + thousands.n * 1000 + tenThousands.n * 10000 AS seq
      FROM
        (SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) ones
      CROSS JOIN
        (SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) tens
      CROSS JOIN
        (SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) hundreds
      CROSS JOIN
        (SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) thousands
      CROSS JOIN
        (SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4) tenThousands
    ) numbers
    WHERE seq < 50000;

    INSERT INTO order_items (id, order_id, sku, quantity, unit_price)
    SELECT
      (orders.id - 1) * 3 + line.n AS id,
      orders.id,
      CONCAT('sku-', LPAD(((orders.id + line.n) % 120) + 1, 4, '0')),
      (line.n % 4) + 1,
      ROUND(15 + ((orders.id + line.n) % 200) * 0.75, 2)
    FROM orders
    CROSS JOIN (
      SELECT 1 AS n
      UNION ALL SELECT 2
      UNION ALL SELECT 3
    ) line;
