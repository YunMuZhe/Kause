apiVersion: v1
kind: ConfigMap
metadata:
  name: fallback-otel-collector-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}

    exporters:
      debug:
        verbosity: normal

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fallback-otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: signoz
      app.kubernetes.io/component: otel-collector
      app.kubernetes.io/name: fallback-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: signoz
        app.kubernetes.io/component: otel-collector
        app.kubernetes.io/name: fallback-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: signoz/signoz-otel-collector:v0.144.4
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - name: otlp
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: fallback-otel-collector-config
