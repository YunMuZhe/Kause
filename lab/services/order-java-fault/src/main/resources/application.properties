server.port=${PORT:8082}
spring.application.name=${OTEL_SERVICE_NAME:order-java-fault}
spring.datasource.url=jdbc:mysql://${DB_HOST:lab-mysql}:${DB_PORT:3306}/${DB_NAME:order_lab}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:order_lab}
spring.datasource.password=${DB_PASSWORD:order_lab_secret}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
